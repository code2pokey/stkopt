name: Keep Render Awake

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: test -n "$RENDER_APP_URL"

      - name: Ping app
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$RENDER_APP_URL"
