<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stkopt Watchlist</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">↗</span><span>CSP</span></div>
    <div class="data-note"><span class="live-dot"></span>  quotes · Cboe opts · delayed</div>
  </header>
  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">Opt desk</p>
      </div>
      <label class="target-badge" for="target-select"><span>Target prm/strik</span><select id="target-select" aria-label="Target premium to strike percentage"></select></label>
    </section>

    <section class="toolbar" aria-label="Watchlist controls">
      <form id="add-form" class="add-form">
        <label class="sr-only" for="symbol-input">Ticker symbol</label>
        <input id="symbol-input" maxlength="8" placeholder="Add ticker, e.g. AAPL" autocomplete="off">
        <button type="submit"><span>+</span> Add stk</button>
      </form>
      <div class="toolbar-actions">
        <span id="watch-count">0 stks</span>
        <button id="refresh" class="icon-button" type="button" title="Refresh watchlist" aria-label="Refresh watchlist">↻</button>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="stock-head">Stk</th>
            <th class="price-head">Price</th>
            <th class="group-head"><span id="next-friday-date"></span></th>
            <th class="single-head">Juice</th>
            <th class="group-head"><span id="following-friday-date"></span></th>
            <th class="single-head">15</th>
            <th class="single-head">30</th>
            <th class="single-head">50</th>
            <th class="single-head">70</th>
            <th class="single-head">90</th>
            <th class="single-head">100</th>
            <th class="single-head">120</th>
            <th class="action-head"></th>
          </tr>
        </thead>
        <tbody id="watchlist"></tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">＋</div>
        <h2>Your watchlist is quiet.</h2>
        <p>Add a ticker above to see its 1% premium-to-strike opts.</p>
      </div>
    </section>
    <footer><span>Prices are delayed and for research only.</span><span>Last refresh <strong id="last-refresh">—</strong></span></footer>
  </main>
</body>
</html>
